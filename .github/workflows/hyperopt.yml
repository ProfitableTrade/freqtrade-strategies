name: Hyperopt
on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "Strategy, example: Strategy"
        required: true
        default: Strategy00
        type: choice
        options:
          - Strategy_Chandelier_ZLSMA
      config:
        description: "Config, example: binance"
        required: true
        type: choice
        default: binance
        options:
          - binance
          - binance1
          - binance2
          - binance1_leverage
          - binance1_leverage_unlim
      start_date:
        description: "Start date - year month day, example: 20230101"
        required: true
        default: "20230101"
      end_date:
        description: "End date - year month day, example: 20230101"
        required: false
        default: ""
      epochs:
        description: "Number of epochs used for hyperopt"
        required: true
        default: "500"
      spaces:
        description: "Specify which parameters to hyperopt. Available options are all,buy,sell,roi,stoploss,trailing,protection,trades,default"
        required: true
        default: all
      loss:
        description: "Hyperopt loss function class"
        required: True
        default: ShortTradeDurHyperOptLoss
        type: choice
        options:
          - ShortTradeDurHyperOptLoss
          - OnlyProfitHyperOptLoss
          - SharpeHyperOptLoss
          - SharpeHyperOptLossDaily
          - SortinoHyperOptLoss
          - SortinoHyperOptLossDaily
          - CalmarHyperOptLoss
          - MaxDrawDownHyperOptLoss
          - MaxDrawDownRelativeHyperOptLoss
          - ProfitDrawDownHyperOptLoss
      time_frames:
        description: "Timeframes, example: 30m"
        required: true
        default: 30m
        type: choice
        options:
         - 3m
         - 5m
         - 15m
         - 30m
         - 1h
         - 2h
         - 3h
         - 4h
         - 12h
      
      

jobs:
  hyperopt:
    runs-on: ubuntu-latest
    env:
      REMOTE_SERVER: root@${{ secrets.REMOTE_SERVER }}
    steps:
      #------------------------------------------------------------
      # Checkout the repository
      #------------------------------------------------------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          submodules: true
      #------------------------------------------------------------
      # Install rsync
      #------------------------------------------------------------
      - name: Install rsync
        run: |
          sudo apt-get install -y rsync
      #------------------------------------------------------------
      # Create ssh private key
      #------------------------------------------------------------
      - name: 🔑 Prepare ssh private key 🔑
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ./id_rsa
          chmod 600 ./id_rsa
      #------------------------------------------------------------
      # Copy to remote
      #------------------------------------------------------------
      - name: 📝 Copy to remote 📝
        run: |
          echo "Copy to remote $REMOTE_SERVER:/root/"
          ssh -o StrictHostKeyChecking=no -i ./id_rsa "$REMOTE_SERVER" "mkdir -p /root/hyperopt/${{ github.run_number }}/user_data"
          rsync -avh -e "ssh -o StrictHostKeyChecking=no -i ./id_rsa" "./hyperopt/" "$REMOTE_SERVER:/root/hyperopt/${{ github.run_number }}"
          rsync -avh -e "ssh -o StrictHostKeyChecking=no -i ./id_rsa" "./user_data/" "$REMOTE_SERVER:/root/hyperopt/${{ github.run_number }}/user_data"
      #------------------------------------------------------------
      # Download data
      #------------------------------------------------------------
      - name: 🗃️ Download data 🗃️
        run: |
          echo Download, strategy: ${{ inputs.strategy }} >> $GITHUB_STEP_SUMMARY | cat
          ssh -o StrictHostKeyChecking=no -i ./id_rsa "$REMOTE_SERVER" <<'EOF' 
          set -e 
          cd /root/hyperopt/${{ github.run_number }}
          docker compose -f docker-compose-backtesting.yml \
            run \
            --rm freqtrade download-data \
            --timeframes ${{ inputs.time_frames }} \
            --timerange ${{ inputs.start_date }}-${{ inputs.end_date }} \
            --config /freqtrade/user_data/${{ inputs.config }}.json \
          EOF | cat >> $GITHUB_STEP_SUMMARY
      #------------------------------------------------------------
      # Hyperopt
      #------------------------------------------------------------
      - name: 🚀 Hyperopt 🚀
        run: |
          echo Hyperopt, strategy: ${{ inputs.strategy }} >> $GITHUB_STEP_SUMMARY | cat
          ssh -o StrictHostKeyChecking=no -i ./id_rsa "$REMOTE_SERVER" <<'EOF' 
          set -e 
          cd /root/hyperopt/${{ github.run_number }}
          docker compose -f docker-compose-backtesting.yml \
            run \
            --rm freqtrade hyperopt \
            --timeframe ${{ inputs.time_frames }} \
            --timerange ${{ inputs.start_date }}-${{ inputs.end_date }} \
            --strategy ${{ inputs.strategy }} \
            --epochs  ${{ inputs.epochs }} \
            --spaces  ${{ inputs.spaces }} \
            --hyperopt-loss ${{ inputs.loss }} \
            --config /freqtrade/user_data/${{ inputs.config }}.json \
          EOF | cat >> $GITHUB_STEP_SUMMARY
